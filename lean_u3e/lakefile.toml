name = "LeanRomanoff"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Romanoff", "RCert"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.style.header = false

# Toolchain leanprover/lean4:v4.35.0-rc3; Mathlib at tag v4.35.0-rc3 (commit c55e6e786f49, see lake-manifest.json).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Romanoff"

# Certificate checker and data (core Lean only), compiled to native code for native_decide.
# Roots: the period-120 checker (RCert) and the U3e stage-2 evaluator (RCert.E.Ev), so that both are in the library's
# shared object that `lake build` loads for downstream modules (Romanoff/E/S2/Native.lean runs the evaluator natively).
[[lean_lib]]
name = "RCert"
roots = ["RCert", "RCert.E.Ev"]
precompileModules = true


# Kernel-only (K) data and shards of the 45a certificate (not precompiled).
[[lean_lib]]
name = "K45"
globs = ["K45.+"]

[[lean_exe]]
name = "m3egenlit"
root = "RCert.M3E.GenLit"
